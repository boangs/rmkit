name: release check

# 发布后立刻验货: 把刚上传的 dist.tar.gz 拉下来, 扫里面的 aarch64 二进制有没有
# A53 不认的 LSE 原子指令。
#
# 为什么必须在 CI 里做: dist/ 被 gitignore, 二进制从来不进仓库, 普通 CI 看不到它们。
# v1.2.1 就是这么漏的 —— Makefile 的基线和编译期自检都对, 但打包用的是修复之前编的
# qml_inject_impl-aarch64.so (147 条内联 LSE), 装到 Paper Pro (ferrari, Cortex-A53)
# 上 xochitl 直接 SIGILL 进 crash loop。见 #7。
#
# 这里失败不会撤回 release (已经发出去了), 但会留下一条醒目的红叉, 并在摘要里写清
# 哪个库有问题该怎么修。真正的第一道闸是发布前在本机跑 scripts/check-dist.sh。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要检查的 release tag (留空用最新的)
        required: false

permissions:
  contents: read

jobs:
  lse:
    name: dist.tar.gz 里有没有 A53 不认的指令
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 装 aarch64 objdump
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq binutils-aarch64-linux-gnu

      - name: 取 dist.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${TAG:-}" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern dist.tar.gz -O dist.tar.gz
          else
            gh release download --repo "$GITHUB_REPOSITORY" --pattern dist.tar.gz -O dist.tar.gz
          fi
          mkdir -p dist-release
          tar xzf dist.tar.gz -C dist-release --strip-components=0
          echo "解开后:"
          find dist-release -type f | head -40

      - name: 扫 LSE
        env:
          OBJDUMP: aarch64-linux-gnu-objdump
        run: |
          set -uo pipefail
          chmod +x scripts/check-dist.sh
          # 包里顶层可能是 dist/ 也可能直接是文件, 两种都试
          target=dist-release
          [ -d dist-release/dist ] && target=dist-release/dist
          scripts/check-dist.sh "$target" | tee result.txt
          code=${PIPESTATUS[0]}
          {
            echo "## dist.tar.gz 指令集体检"
            echo
            echo '```'
            cat result.txt
            echo '```'
            if [ "$code" -ne 0 ]; then
              echo
              echo "### 这个 release 装到 Paper Pro (ferrari) 上会 crash loop"
              echo
              echo "打 ✗ 的库会被加载进 xochitl 进程，A53 执行到 LSE 指令即 SIGILL。"
              echo "去编译机重编后重新上传 \`dist.tar.gz\`："
              echo
              echo '```'
              echo "scp -r intercept/qml-inject boangs@<编译机>:/tmp/"
              echo "ssh  boangs@<编译机> 'cd /tmp/qml-inject && make'"
              echo "scp  'boangs@<编译机>:/tmp/qml-inject/qml_inject*-aarch64.so' dist/"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
