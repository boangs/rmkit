# USB 诊断网络 DHCP 配置: rm-android-init configure_usb_diagnostics() 要求与 /usr/sbin/usb-ether-once 同时存在
# 设备侧固定 10.11.99.1/27, 给主机分配同段 .2
start           10.11.99.2
end             10.11.99.2
interface       usb0
max_leases      1
option subnet   255.255.255.224
option lease    86400
lease_file      /var/lib/misc/udhcpd-usb.leases
pidfile         /var/run/udhcpd-usb.pid
